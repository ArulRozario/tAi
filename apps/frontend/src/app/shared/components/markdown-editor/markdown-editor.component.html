<div class="markdown-editor">
  <!-- Toolbar -->
  <div class="md-toolbar">
    <div class="md-toolbar-group">
      <button class="md-toolbtn" (click)="toggleBold()" title="Bold">
        <b>B</b>
      </button>
      <button class="md-toolbtn" (click)="toggleItalic()" title="Italic">
        <i>I</i>
      </button>
      <span class="md-toolbar-sep"></span>
      <button class="md-toolbtn" (click)="setHeading(1)" title="Heading 1">H1</button>
      <button class="md-toolbtn" (click)="setHeading(2)" title="Heading 2">H2</button>
      <button class="md-toolbtn" (click)="setHeading(3)" title="Heading 3">H3</button>
      <button class="md-toolbtn" (click)="setParagraph()" title="Paragraph">P</button>
      <span class="md-toolbar-sep"></span>
      <button class="md-toolbtn" (click)="toggleBulletList()" title="Bullet List">
        <i class="pi pi-list" style="font-size: 11px;"></i>
      </button>
      <button class="md-toolbtn" (click)="toggleOrderedList()" title="Numbered List">
        <i class="pi pi-sort-numeric-up" style="font-size: 11px;"></i>
      </button>
      <button class="md-toolbtn" (click)="toggleBlockquote()" title="Blockquote">
        <i class="pi pi-quote-right" style="font-size: 11px;"></i>
      </button>
      <button class="md-toolbtn" (click)="insertTable()" title="Insert Table">
        <i class="pi pi-table" style="font-size: 11px;"></i>
      </button>
      <span class="md-toolbar-sep"></span>
      <button class="md-toolbtn" (click)="undo()" title="Undo">
        <i class="pi pi-undo" style="font-size: 11px;"></i>
      </button>
      <button class="md-toolbtn" (click)="redo()" title="Redo">
        <i class="pi pi-refresh" style="font-size: 11px;"></i>
      </button>
    </div>

    <div class="md-toolbar-group md-mode-group">
      <button
        class="md-modebtn"
        [class.active]="isActive('wysiwyg')"
        (click)="setViewMode('wysiwyg')"
        title="WYSIWYG">
        <i class="pi pi-eye" style="font-size: 10px;"></i> WYSIWYG
      </button>
      <button
        class="md-modebtn"
        [class.active]="isActive('split')"
        (click)="setViewMode('split')"
        title="Split View">
        <i class="pi pi-columns" style="font-size: 10px;"></i> Split
      </button>
      <button
        class="md-modebtn"
        [class.active]="isActive('markdown')"
        (click)="setViewMode('markdown')"
        title="Markdown Source">
        <i class="pi pi-code" style="font-size: 10px;"></i> MD
      </button>
    </div>
  </div>

  <!-- Editor Area -->
  <div class="md-editor-area" [class.mode-wysiwyg]="isActive('wysiwyg')" [class.mode-split]="isActive('split')" [class.mode-markdown]="isActive('markdown')">
    <!-- WYSIWYG Pane -->
    @if (isActive('wysiwyg') || isActive('split')) {
      <div class="md-pane md-wysiwyg-pane" #wysiwygPane>
        <div class="milkdown-container"></div>
      </div>
    }

    <!-- Split Divider -->
    @if (isActive('split')) {
      <div class="md-split-divider"></div>
    }

    <!-- Markdown Pane -->
    @if (isActive('markdown') || isActive('split')) {
      <div class="md-pane md-markdown-pane">
        <textarea
          #markdownTextarea
          class="md-textarea"
          [value]="markdownSource"
          (input)="onMarkdownInput($event)"
          [placeholder]="placeholder"
          spellcheck="false">
        </textarea>
      </div>
    }
  </div>
</div>
