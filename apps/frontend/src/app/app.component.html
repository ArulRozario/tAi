<div class="app-layout" [class.login-layout]="loginPage()">
  <p-toast position="top-right" [breakpoints]="{ '920px': { width: '100%', right: '0', left: '0' } }"></p-toast>

  @if (!loginPage()) {
    <app-sidebar></app-sidebar>
  }

  <main class="main-content">
    <!-- Hamburger — mobile only, hidden on ≥ 640px via CSS -->
    @if (!loginPage()) {
      <button class="mobile-hamburger" (click)="layout.toggleMobileMenu()" aria-label="Open navigation">
        <i class="pi pi-bars"></i>
      </button>
    }

    <div class="canvas" [class.canvas--full]="fullPage()">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
