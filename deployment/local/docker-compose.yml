services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: tai-db-postgres
    environment:
      POSTGRES_USER: tai
      POSTGRES_PASSWORD: tai123
      POSTGRES_DB: tai_dev
    ports:
      - "12000:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tai -d tai_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tai-network

  minio:
    image: minio/minio:latest
    container_name: tai-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "12002:9000"
      - "12003:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tai-network

  # Creates the tai-uploads bucket on first start; exits 0 when done.
  minio-init:
    image: minio/mc:latest
    container_name: tai-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        until mc alias set local http://minio:9000 minioadmin minioadmin 2>/dev/null; do
          echo 'Waiting for MinIO...'; sleep 2;
        done;
        mc mb --ignore-existing local/tai-uploads;
        echo 'Bucket ready';
      "
    networks:
      - tai-network
  # Runs migrations + seed on every startup; exits 0 when done.
  db-init:
    build:
      context: ../../
      dockerfile: deployment/local/Dockerfile.api.dev
    container_name: tai-db-init
    command: >
      sh -c "
        npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma &&
        node -r @swc-node/register apps/api/prisma/seed.ts
      "
    env_file: ../../.env
    environment:
      DATABASE_URL: "postgresql://tai:tai123@postgres:5432/tai_dev?schema=public"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - tai-network

  api:
    build:
      context: ../../
      dockerfile: deployment/local/Dockerfile.api.dev
    container_name: tai-api-dev
    ports:
      - "3001:3001"
    # Load .env for secrets (JWT_SECRET, GEMINI_API_KEY, etc.)
    # environment: overrides below replace localhost URLs with Docker service names
    env_file: ../../.env
    environment:
      NODE_ENV: development
      PORT: "3001"
      DATABASE_URL: "postgresql://tai:tai123@postgres:5432/tai_dev?schema=public"
      STORAGE_ENDPOINT: "http://minio:9000"
      STORAGE_REGION: "us-east-1"
      STORAGE_ACCESS_KEY: "minioadmin"
      STORAGE_SECRET_KEY: "minioadmin"
      STORAGE_BUCKET: "tai-uploads"
      STORAGE_PUBLIC_URL: "http://localhost:12002/tai-uploads"
      OLLAMA_ENDPOINT: "http://ollama:11434"
    volumes:
      # Bind-mount source for hot-reload; node_modules stay in the image layer
      - ../../apps:/app/apps
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks:
      - tai-network

  frontend:
    build:
      context: ../../
      dockerfile: deployment/local/Dockerfile.frontend.dev
    container_name: tai-frontend-dev
    ports:
      - "4200:4200"
    volumes:
      # Bind-mount source for hot-reload; node_modules stay in the image layer
      - ../../apps:/app/apps
    depends_on:
      - api
    networks:
      - tai-network

networks:
  tai-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:

