name: Deploy

# Only runs after the CI workflow completes on main — and only if it passed.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

# Bail out immediately if CI didn't pass (cancelled, failed, etc.)
jobs:
  # ── API → Render ────────────────────────────────────────────────────────────
  deploy-api:
    name: Deploy API to Render
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Trigger Render deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  # ── Frontend → Cloudflare Pages ─────────────────────────────────────────────
  deploy-frontend:
    name: Deploy frontend to Cloudflare Pages
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm nx build frontend --configuration=production

      - name: Inject API proxy rule
        # Cloudflare Pages rewrites /api/* → your Render API URL
        run: |
          echo "/api/* ${{ secrets.RENDER_API_URL }}/api/:splat 200" \
            > dist/apps/frontend/browser/_redirects

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/apps/frontend/browser --project-name=tai --branch=${{ github.event.workflow_run.head_branch }}
