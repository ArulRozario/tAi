services:
  postgres:
    image: postgres:17-alpine
    container_name: tai-postgres
    environment:
      POSTGRES_USER: tai
      POSTGRES_PASSWORD: tai123
      POSTGRES_DB: tai_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tai-network

  minio:
    image: minio/minio:latest
    container_name: tai-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - tai-network

  ollama:
    image: ollama/ollama:latest
    container_name: tai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0
    networks:
      - tai-network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: tai-api
    environment:
      DATABASE_URL: postgresql://tai:tai123@postgres:5432/tai_dev?schema=public
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: tai-uploads
      OLLAMA_BASE_URL: http://ollama:11434
      JWT_SECRET: tai-production-secret-change-me
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      ollama:
        condition: service_started
    networks:
      - tai-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: tai-frontend
    ports:
      - "4200:80"
    depends_on:
      - api
    networks:
      - tai-network
    restart: unless-stopped

networks:
  tai-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  ollama_data: