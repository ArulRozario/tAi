<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>tAI — Interactive Style & Screen Mockup Viewer</title>
  <!-- Compiled Styles -->
  <link rel="stylesheet" href="compiled-styles.css">
  <link rel="stylesheet" href="https://unpkg.com/primeicons/primeicons.css">
  
  <style>
    /* Custom font declarations */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
    
    :root {
      --bg: #09090b;
      --surface-1: #18181b;
      --surface-2: #27272a;
      --border: #3f3f46;
      --text-1: #fafafa;
      --text-2: #a1a1aa;
      --text-3: #52525b;
      --accent: #8b5cf6;
      --accent-soft: rgba(139, 92, 246, 0.15);
      --success: #10b981;
      --success-soft: rgba(16, 185, 129, 0.15);
      --warning: #f59e0b;
      --warning-soft: rgba(245, 158, 11, 0.15);
      --error: #ef4444;
      --error-soft: rgba(239, 68, 68, 0.15);
      --font-sans: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    
    body {
      background-color: var(--bg);
      color: var(--text-1);
      font-family: var(--font-sans);
    }
    
    /* Simple custom mock implementations of standard styles */
    .btn--block {
      width: 100%;
      text-align: center;
      justify-content: center;
    }
    
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .status-dot--approved { background-color: var(--success); }
    .status-dot--review { background-color: var(--warning); }
    .status-dot--pending { background-color: var(--text-3); }
    .status-dot--changes { background-color: var(--error); }
    .status-dot--processing { background-color: var(--accent); }
    
    /* Modal styles */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-card {
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 540px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.4);
    }
    
    /* Genre lists */
    .genre-card {
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .genre-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    
    /* Navigation top bar styles */
    .shell-navbar {
      background-color: var(--surface-1);
      border-bottom: 1px solid var(--border);
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }
    .shell-nav-links {
      display: flex;
      gap: 16px;
    }
    .shell-nav-link {
      color: var(--text-2);
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      border: none;
      background: none;
    }
    .shell-nav-link.is-active {
      color: var(--text-1);
      font-weight: 600;
    }
    .shell-nav-link:hover {
      color: var(--text-1);
    }
    
    /* Input elements styling in dark mode */
    .input, .select, .textarea {
      background-color: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-1);
      padding: 8px 12px;
      border-radius: 6px;
      width: 100%;
      box-sizing: border-box;
      outline: none;
    }
    .input:focus, .select:focus, .textarea:focus {
      border-color: var(--accent);
    }
    
    .genre-picker {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      background: var(--surface-2);
      font-size: 13px;
    }
    .genre-picker__dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    
    .divider {
      height: 1px;
      background: var(--border);
      margin: 16px 0;
    }
    
    /* Custom page grid for project detail */
    .page-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
      gap: 8px;
      margin-top: 12px;
    }
    .page-grid__cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
    }
    .page-grid__cell.s-approved { background: var(--success-soft); color: var(--success); border-color: rgba(16, 185, 129, 0.3); }
    .page-grid__cell.s-review { background: var(--warning-soft); color: var(--warning); border-color: rgba(245, 158, 11, 0.3); }
    .page-grid__cell.s-pending { background: var(--surface-2); color: var(--text-2); border-color: var(--border); }
    .page-grid__cell.s-changes { background: var(--error-soft); color: var(--error); border-color: rgba(239, 68, 68, 0.3); }
    .page-grid__cell.s-processing { background: var(--accent-soft); color: var(--accent); border-color: rgba(139, 92, 246, 0.3); }
    
    /* Simple code-editor highlighter mock */
    .code-editor {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.5;
      color: var(--text-2);
    }
    .code-editor .h { color: var(--accent); font-weight: 600; }
    .code-editor .k { color: var(--warning); }
    .code-editor .s { color: var(--success); }
    
    /* Admin config settings tabs */
    .tabs {
      display: flex;
      gap: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }
    .tab {
      background: none;
      border: none;
      color: var(--text-3);
      padding: 8px 4px;
      cursor: pointer;
      font-weight: 500;
      font-size: 14px;
    }
    .tab.is-active {
      color: var(--accent);
      border-bottom: 2px solid var(--accent);
    }
    
    /* Genre Editor layout */
    .genre-editor {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 48px);
      overflow: hidden;
    }
    .genre-editor__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 48px;
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
    }
    .genre-editor__title {
      font-size: 14px;
      font-weight: 600;
      background: transparent;
      border: none;
      color: var(--text-1);
      outline: none;
    }
    .genre-editor__tabs {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 36px;
      background-color: var(--surface-1);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
    }
    .view-tab {
      display: flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      color: var(--text-2);
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .view-tab.is-active {
      background: var(--surface-2);
      color: var(--text-1);
    }
    .genre-editor__body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    .genre-editor__doc {
      flex: 1;
      display: flex;
      min-width: 0;
    }
    .genre-editor__doc--split .md-editor { width: 50%; border-right: 1px solid var(--border); }
    .genre-editor__doc--split .md-preview { width: 50%; }
    .genre-editor__doc--edit .md-editor { width: 100%; }
    .genre-editor__doc--preview .md-preview { width: 100%; }
    
    .md-editor {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .md-editor__toolbar {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 36px;
      border-bottom: 1px solid var(--border);
      padding: 0 8px;
      background-color: var(--surface-1);
    }
    .md-editor__area {
      flex: 1;
      background-color: var(--bg);
      border: none;
      resize: none;
      padding: 16px;
      font-family: var(--font-sans);
      color: var(--text-1);
    }
    .md-preview {
      overflow-y: auto;
      padding: 24px;
    }
    .md-preview__inner {
      max-width: 650px;
      margin: 0 auto;
      font-size: 14px;
      line-height: 1.7;
    }
    
    .genre-chat {
      width: 320px;
      border-left: 1px solid var(--border);
      background-color: var(--surface-1);
      display: flex;
      flex-direction: column;
    }
    .genre-chat__head {
      height: 48px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }
    .genre-chat__brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
    }
    .genre-chat__mode {
      display: flex;
      padding: 8px;
      gap: 4px;
      border-bottom: 1px solid var(--border);
    }
    .mode-pill {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px;
      cursor: pointer;
      color: var(--text-2);
    }
    .mode-pill.is-active {
      background: var(--surface-2);
      color: var(--text-1);
      border-color: var(--accent);
    }
    .mode-pill__hint {
      font-size: 10px;
      color: var(--text-3);
    }
    .genre-chat__thread {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .chat-msg {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .chat-msg--assistant {
      align-self: flex-start;
    }
    .chat-msg--user {
      align-self: flex-end;
      background-color: var(--surface-2);
      border-radius: 8px;
      padding: 8px 12px;
      max-width: 85%;
    }
    .chat-msg__head {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .chat-msg__avatar {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background-color: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .chat-msg__name {
      font-size: 11px;
      font-weight: 600;
    }
    .chat-msg__mode {
      font-size: 10px;
      border-radius: 4px;
      padding: 2px 6px;
      background: var(--surface-2);
    }
    .chat-msg__body {
      font-size: 12px;
      line-height: 1.5;
    }
    .genre-chat__quick {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 8px;
      border-top: 1px solid var(--border);
    }
    .quick-prompt {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 10px;
      padding: 4px 8px;
      cursor: pointer;
      color: var(--text-2);
    }
    .quick-prompt:hover {
      border-color: var(--accent);
      color: var(--text-1);
    }
    .genre-chat__composer {
      padding: 12px;
      border-top: 1px solid var(--border);
      background-color: var(--bg);
    }
    .composer-mode-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: var(--text-2);
      margin-bottom: 6px;
    }
    .composer-input {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface-1);
      overflow: hidden;
    }
    .composer-input textarea {
      background: transparent;
      border: none;
      resize: none;
      padding: 8px;
      color: var(--text-1);
      font-size: 12px;
      outline: none;
    }
    .composer-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 8px;
      border-top: 1px solid var(--border);
      background: var(--surface-2);
    }
    
    /* Version history drawer */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 100;
    }
    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 360px;
      background: var(--surface-1);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 101;
    }
    .drawer__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }
    .drawer__body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .drawer__foot {
      padding: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    .version-row {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
    }
    .version-row.is-selected {
      border-color: var(--accent);
      background-color: var(--surface-2);
    }
    .version-row__tag {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 11px;
    }
    
    .genre-select-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }
    .genre-select-item {
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
    }
    .genre-select-item.is-selected {
      border-color: var(--accent);
      background-color: var(--surface-2);
    }
    .genre-select-item__icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .dropzone {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }
    .dropzone.is-active {
      border-color: var(--accent);
      background-color: var(--surface-2);
    }
    
    .input-group {
      display: flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 6px;
      background-color: var(--bg);
      padding: 0 10px;
    }
    .input-group input {
      background: transparent;
      border: none;
      color: var(--text-1);
      padding: 8px 6px;
      font-size: 13px;
      outline: none;
      width: 100%;
    }
  </style>
</head>

          { id: "s4", status: "good", en: "but that the world through Him might be saved.", ta: "உலகம் அவராலே இரட்சிக்கப்படுவதற்காகவே அவரை அனுப்பினார்.", selected: false }

  <!-- Global Shared Components Definition -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Btn Component Mapping
    const Btn = ({ children, kind = "secondary", size = "md", icon, className = "", onClick, ...props }) => {
      let baseClass = "p-button";
      if (kind === "ghost") baseClass += " p-button-text";
      if (kind === "primary") baseClass += " p-button-primary";
      if (kind === "success") baseClass += " p-button-success";
      if (kind === "danger") baseClass += " p-button-danger";
      if (kind === "warning") baseClass += " p-button-warning";
      
      if (size === "sm") baseClass += " p-button-sm";
      if (size === "lg") baseClass += " p-button-lg";
      
      let iconMarkup = null;
      if (icon) {
        let piName = icon;
        if (icon === "plus") piName = "plus";
        if (icon === "download") piName = "download";
        if (icon === "edit") piName = "pencil";
        if (icon === "more") piName = "ellipsis-v";
        if (icon === "arrowLeft") piName = "arrow-left";
        if (icon === "arrowRight") piName = "arrow-right";
        if (icon === "chevronLeft") piName = "chevron-left";
        if (icon === "chevronRight") piName = "chevron-right";
        if (icon === "chevronDown") piName = "chevron-down";
        if (icon === "columns") piName = "th-large";
        if (icon === "layout") piName = "table";
        if (icon === "sparkles") piName = "sparkles";
        if (icon === "history") piName = "history";
        if (icon === "play") piName = "play";
        if (icon === "check") piName = "check";
        if (icon === "filter") piName = "filter";
        if (icon === "bolt") piName = "bolt";
        if (icon === "terminal") piName = "code";
        if (icon === "settings") piName = "cog";
        if (icon === "send") piName = "send";
        if (icon === "x") piName = "times";
        if (icon === "refresh") piName = "refresh";
        if (icon === "users") piName = "users";
        if (icon === "flag") piName = "flag";
        
        iconMarkup = <i className={`pi pi-${piName} ${children ? 'mr-2' : ''}`} style={{ fontSize: size === 'sm' ? '11px' : '13px' }}></i>;
      }

      return (
        <button className={`${baseClass} ${className} inline-flex items-center justify-center`} onClick={onClick} {...props}>
          {iconMarkup}
          {children}
        </button>
      );
    };

    // Icon Component
    const Icon = ({ name, size = 14, style = {}, ...props }) => {
      let piName = name;
      if (name === "arrowUp") piName = "arrow-up";
      if (name === "arrowDown") piName = "arrow-down";
      if (name === "arrowLeft") piName = "arrow-left";
      if (name === "arrowRight") piName = "arrow-right";
      if (name === "plus") piName = "plus";
      if (name === "download") piName = "download";
      if (name === "pencil" || name === "edit") piName = "pencil";
      if (name === "chevronDown") piName = "chevron-down";
      if (name === "chevronLeft") piName = "chevron-left";
      if (name === "chevronRight") piName = "chevron-right";
      if (name === "columns") piName = "th-large";
      if (name === "layout") piName = "table";
      if (name === "sparkles") piName = "sparkles";
      if (name === "history") piName = "history";
      if (name === "check") piName = "check";
      if (name === "search") piName = "search";
      if (name === "upload") piName = "upload";
      if (name === "settings") piName = "cog";
      if (name === "star") piName = "star";
      if (name === "book") piName = "book";
      if (name === "note") piName = "envelope";
      if (name === "send") piName = "send";
      if (name === "x") piName = "times";
      if (name === "refresh") piName = "refresh";
      if (name === "users") piName = "users";
      if (name === "flag") piName = "flag";
      if (name === "diff") piName = "directions";
      
      return <i className={`pi pi-${piName}`} style={{ fontSize: `${size}px`, ...style }} {...props}></i>;
    };

    // Pill Component
    const Pill = ({ children, kind = "default", dot = false, ...props }) => {
      let baseClass = "p-tag";
      if (kind === "success") baseClass += " p-tag-success";
      if (kind === "error" || kind === "danger") baseClass += " p-tag-danger";
      if (kind === "warning" || kind === "warn") baseClass += " p-tag-warning";
      if (kind === "accent") baseClass += " bg-purple-950 text-purple-200 border-purple-500 border";
      if (kind === "info") baseClass += " bg-blue-950 text-blue-200 border-blue-500 border";
      
      return (
        <span className={`${baseClass} inline-flex items-center gap-1`} {...props}>
          {dot && <span className="status-dot mr-1" style={{ width: 6, height: 6, backgroundColor: kind === "success" ? 'var(--success)' : kind === 'error' || kind === 'danger' ? 'var(--error)' : kind === 'warning' ? 'var(--warning)' : 'var(--text-1)' }}></span>}
          {children}
        </span>
      );
    };

    // PriorityPill Component
    const PriorityPill = ({ level }) => {
      const lower = level ? level.toLowerCase() : "low";
      if (lower === "high") return <Pill kind="error">High</Pill>;
      if (lower === "medium") return <Pill kind="warning">Medium</Pill>;
      return <Pill>Low</Pill>;
    };

    // StatusDot Component
    const StatusDot = ({ status }) => {
      let className = "status-dot--pending";
      if (status === "approved" || status === "complete" || status === "Active") className = "status-dot--approved";
      if (status === "review" || status === "In progress") className = "status-dot--review";
      if (status === "changes" || status === "Escalated" || status === "error") className = "status-dot--changes";
      if (status === "processing") className = "status-dot--processing";
      return <span className={`status-dot ${className}`}></span>;
    };

    // StatusPill Component
    const StatusPill = ({ status }) => {
      let kind = "default";
      if (status === "Approved" || status === "Complete" || status === "Active") kind = "success";
      if (status === "review" || status === "In progress" || status === "Pending" || status === "review") kind = "warning";
      if (status === "Changes" || status === "Escalated" || status === "changes" || status === "error") kind = "danger";
      if (status === "processing" || status === "Processing") kind = "accent";
      return <Pill kind={kind} dot>{status}</Pill>;
    };

    // Progress bar
    const Progress = ({ value = 0, kind }) => {
      let cls = "p-progressbar";
      if (kind === "success") cls += " p-progressbar-success";
      if (kind === "error" || kind === "danger") cls += " p-progressbar-danger";
      if (kind === "warning" || kind === "warn") cls += " p-progressbar-warning";
      return (
        <div className={cls}>
          <div className="p-progressbar-value" style={{ width: `${value}%` }}></div>
        </div>
      );
    };

    // Avatar
    const Avatar = ({ initials, color = "var(--surface-2)" }) => {
      return (
        <div className="p-avatar inline-flex items-center justify-center rounded-full text-zinc-100 font-semibold" style={{ width: 24, height: 24, backgroundColor: color }}>
          {initials}
        </div>
      );
    };

    // QualityRing
    const QualityRing = ({ value = 0, size = 48 }) => {
      const color = value < 60 ? "var(--error)" : value < 80 ? "var(--warning)" : "var(--success)";
      return (
        <div className="relative inline-flex items-center justify-center" style={{ width: size, height: size }}>
          <svg className="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
            <path className="text-zinc-800" strokeWidth="3" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
            <path style={{ stroke: color }} strokeDasharray={`${value}, 100`} strokeWidth="3.2" strokeLinecap="round" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
          </svg>
          <span className="absolute font-mono text-xs font-bold" style={{ color }}>{value}%</span>
        </div>
      );
    };

    // Modal Component
    const Modal = ({ title, children, onClose, footer }) => {
      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal-card" onClick={(e) => e.stopPropagation()}>
            <div className="flex justify-between items-center mb-4 pb-3 border-b border-zinc-800">
              <h3 className="text-base font-semibold text-zinc-100">{title}</h3>
              <Btn kind="ghost" size="sm" icon="x" onClick={onClose} />
            </div>
            <div className="mb-4 text-sm">{children}</div>
            <div className="flex justify-end gap-2 pt-3 border-t border-zinc-800">{footer}</div>
          </div>
        </div>
      );
    };

    window.Btn = Btn;
    window.Icon = Icon;
    window.Pill = Pill;
    window.PriorityPill = PriorityPill;
    window.StatusDot = StatusDot;
    window.StatusPill = StatusPill;
    window.Progress = Progress;
    window.Avatar = Avatar;
    window.QualityRing = QualityRing;
    window.Modal = Modal;
  </script>

  <!-- Screens Loader -->
  <script type="text/babel" src="screens/auth.jsx"></script>
  <script type="text/babel" src="screens/dashboard.jsx"></script>
  <script type="text/babel" src="screens/projects.jsx"></script>
  <script type="text/babel" src="screens/queue.jsx"></script>
  <script type="text/babel" src="screens/review.jsx"></script>
  <script type="text/babel" src="screens/workbench.jsx"></script>

  <!-- Unified Main App Mounting -->
  <script type="text/babel">
    const App = () => {
      const [screen, setScreen] = useState("auth");
      const [screenData, setScreenData] = useState(null);

      const handleNavigate = (target, data = null) => {
        setScreen(target);
        setScreenData(data);
      };

      const handleBack = () => {
        if (screen === "projectDetail") {
          handleNavigate("projects");
        } else if (screen === "genreEditor") {
          handleNavigate("genres");
        } else if (screen === "review") {
          handleNavigate("queue");
        } else if (screen === "workbench") {
          handleNavigate("projects");
        } else {
          handleNavigate("dashboard");
        }
      };

      const showNavShell = screen !== "auth" && screen !== "workbench" && screen !== "genreEditor";

      return (
        <div className="min-h-screen flex flex-col">
          {/* Global Header Shell */}
          {showNavShell && (
            <header className="shell-navbar shrink-0">
              <div className="flex items-center gap-6">
                <div className="text-zinc-100 font-bold tracking-wider text-base cursor-pointer" onClick={() => handleNavigate("dashboard")}>
                  <span className="text-purple-500 font-extrabold">t</span>AI
                </div>
                <div className="shell-nav-links">
                  <button className={`shell-nav-link ${screen === 'dashboard' ? 'is-active' : ''}`} onClick={() => handleNavigate("dashboard")}>Dashboard</button>
                  <button className={`shell-nav-link ${screen === 'projects' || screen === 'projectDetail' ? 'is-active' : ''}`} onClick={() => handleNavigate("projects")}>Projects</button>
                  <button className={`shell-nav-link ${screen === 'queue' || screen === 'review' ? 'is-active' : ''}`} onClick={() => handleNavigate("queue")}>Queue</button>
                  <button className={`shell-nav-link ${screen === 'genres' || screen === 'genreEditor' ? 'is-active' : ''}`} onClick={() => handleNavigate("genres")}>Genres</button>
                  <button className={`shell-nav-link ${screen === 'admin' ? 'is-active' : ''}`} onClick={() => handleNavigate("admin")}>Admin Override</button>
                  <button className={`shell-nav-link ${screen === 'team' ? 'is-active' : ''}`} onClick={() => handleNavigate("team")}>Team</button>
                  <button className={`shell-nav-link ${screen === 'settings' ? 'is-active' : ''}`} onClick={() => handleNavigate("settings")}>Settings</button>
                  <button className={`shell-nav-link ${screen === 'rules' ? 'is-active' : ''}`} onClick={() => handleNavigate("rules")}>Rules</button>
                </div>
              </div>
              <div className="flex items-center gap-3">
                <span className="text-xs text-zinc-400 font-mono">Selvi R. (Reviewer)</span>
                <Avatar initials="SR" color="#6ea8ff" />
                <Btn kind="ghost" size="sm" icon="x" onClick={() => handleNavigate("auth")} title="Sign out" />
              </div>
            </header>
          )}

          {/* Core Content Switching Router */}
          <main className="flex-1 min-h-0 flex flex-col">
            {screen === "auth" && <AuthScreen onSignIn={() => handleNavigate("dashboard")} />}
            {screen === "dashboard" && <Dashboard onNavigate={handleNavigate} />}
            {screen === "projects" && <ProjectsList onNavigate={handleNavigate} />}
            {screen === "projectDetail" && <ProjectDetail project={screenData} onNavigate={handleNavigate} onBack={handleBack} />}
            {screen === "queue" && <Queue onNavigate={handleNavigate} />}
            {screen === "review" && <Review onNavigate={handleNavigate} onBack={handleBack} />}
            {screen === "workbench" && <Workbench onNavigate={handleNavigate} onBack={handleBack} />}
            {screen === "genres" && <GenresList onNavigate={handleNavigate} />}
            {screen === "genreEditor" && <GenreEditor genre={screenData} onBack={handleBack} />}
            {screen === "admin" && <Admin onNavigate={handleNavigate} />}
            {screen === "team" && <Team />}
            {screen === "settings" && <Settings />}
            {screen === "rules" && <Rules />}
          </main>
        </div>
      );
    };

    const rootElement = document.getElementById("root");
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
