services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: tai-db-postgres
    environment:
      POSTGRES_USER: tai
      POSTGRES_PASSWORD: tai123
      POSTGRES_DB: tai
    ports:
      - "12000:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tai -d tai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tai-network

  minio:
    image: minio/minio:latest
    container_name: tai-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "12002:9000"
      - "12003:9001"
    volumes:
      - minio_data:/data
    networks:
      - tai-network

  ollama:
    image: ollama/ollama:latest
    container_name: tai-ollama
    ports:
      - "12005:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0
    networks:
      - tai-network

  nlp:
    build:
      context: .
      dockerfile: Dockerfile.nlp
    container_name: tai-nlp
    ports:
      - "12004:8001"
    networks:
      - tai-network

networks:
  tai-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  ollama_data: